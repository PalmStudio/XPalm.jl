name: CI
on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu, windows and macos, latest Julia versions (mac on arm, others on x64)
          - os: ubuntu-latest
            arch: x64
            version: "1.12.1"
            reference_regression: "true"
          - os: windows-latest
            arch: x64
            version: "1"
            reference_regression: "false"
          # macOS - aarch64 (ARM) only, both Julia versions
          - os: macOS-latest
            arch: aarch64
            version: "1"
            reference_regression: "false"
          # Also test Julia 1.10 on windows for retrocompatibility (most common OS)
          - os: windows-latest
            arch: x64
            version: "1.10"
            reference_regression: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # Julia 1.10 does not yet interpret Project.toml [sources]. Bootstrap the
      # same committed development dependencies used by newer Julia versions.
      - name: Resolve pinned development dependencies on Julia 1.10
        if: matrix.version == '1.10'
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.add([
            PackageSpec(
              name="PlantSimEngine",
              url="https://github.com/VirtualPlantLab/PlantSimEngine.jl",
              rev="82786fba91fad644d8068d75afc64d88282400c4",
            ),
            PackageSpec(
              name="PlantGeom",
              url="https://github.com/VEZY/PlantGeom.jl",
              rev="9d682ef1aaebe7ecf5aa8407a8305d6f4aad51c1",
            ),
          ])
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          XPALM_RUN_REFERENCE_REGRESSION: ${{ matrix.reference_regression }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using XPalm
          DocMeta.setdocmeta!(XPalm, :DocTestSetup, :(using XPalm); recursive=true)
          doctest(XPalm)
