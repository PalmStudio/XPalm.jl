# Provisional ontogenetic geometry for the petiole base. The 1 cm × 1 mm
# juvenile endpoint is reused from the JPCE EKA1 reconstruction script, where
# it was chosen as a visual setting rather than measured. A log-smoothstep
# transition preserves positive dimensions and reaches the historical adult
# 30 cm × 10 cm geometry by emitted leaf 110. The immutable emitted-leaf number
# is used instead of the current botanical rank.
leaf_base_width_juvenile: 0.01 # Juvenile leaf-base width (m)
leaf_base_height_juvenile: 0.001 # Juvenile leaf-base height (m)
leaf_base_dimensions_juvenile_max_emitted_leaf: 60
leaf_base_dimensions_adult_min_emitted_leaf: 110
