cpoint_width_slope: 0.0119703143572554 # Rachis width at the c-point slope for linear interpolation
# Juvenile section power laws fitted to the 14 JPCE EKA1 rachises for which
# length, width and thickness were measured together (the section is assumed
# to be the C point from the measurement context; its position was not written
# explicitly in the workbook). The observed juvenile range ends at 1.71 m.
# Between 1.71 and the first SMSE adult rachis at 2.45 m, a smooth transition
# reconnects to the historical adult VPalm C-point allometry.
cpoint_width_juvenile_coefficient: 0.016703016868963633 # Width at R = 1 m (m)
cpoint_width_juvenile_exponent: 0.5380602349548408
cpoint_height_juvenile_coefficient: 0.010647944528255593 # Height at R = 1 m (m)
cpoint_height_juvenile_exponent: 0.5125167752290531
cpoint_dimensions_juvenile_max_rachis_length: 1.71 # Last measured juvenile rachis (m)
cpoint_dimensions_adult_min_rachis_length: 2.45 # First measured adult rachis (m)
# SMSE terminal-section measurements are 3 mm wide. The former 0.03 m value
# was a factor-ten unit error and made short rachises widen towards their tip.
