# XPalm simulates structural dry mass. These fractions convert each simulated
# leaf compartment to fresh mass before it is passed to VPalm. Values are the
# medians of the component water-content observations in
# XPalm_calibration/0-data/LeafGrowth_CIGE.csv (three sites); they are kept
# explicit because the biomechanical parameters were fitted on fresh mass.
xpalm_coupling:
  leaflets_dry_matter_fraction: 0.430
  rachis_dry_matter_fraction: 0.308
  petiole_dry_matter_fraction: 0.273
  # Linear dimensions scale approximately with the square root of acquired
  # structural biomass, so one-sided leaflet area scales with biomass.
  dimension_growth_exponent: 0.5
# Mean young-palm allometry from Perez et al. (2016), Fig. 2A. Plant age is
# represented by the number of leaves emitted since planting.
rachis_length_age_intercept: 0.834 # rachis length intercept (m)
rachis_length_age_slope: 0.03222 # rachis length increase per emitted leaf (m leaf-1)
rachis_length_age_max: 6.62 # adult plateau (m), Perez (2017), Table IV.2 mean at 450 leaves
# Provisional juvenile correction fitted on the 31 initial-crown rachis
# measurements of JPCE EKA1/EKA2. It is connected continuously to the Perez
# linear law, which remains unchanged from leaf 12 onward. The sequence is a
# visual-emission alignment pending explicit pre-planting crown initialization.
rachis_length_juvenile_transition_leaf: 12
rachis_length_juvenile_exponent: 0.575
leaflet_lamina_angle: 140 # V-shape of the leaflet, °
